<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#d8f0c8" />
    <title>Recycle Factory</title>
  </head>
  <body>
    <main id="app">
      <div id="game-root" aria-label="Recycle Factory oyun alanı"></div>

      <section id="hud" aria-live="polite">
        <div class="hud-pill"><span>💵</span><strong id="money-value">0</strong></div>
        <div class="hud-pill"><span>🎒</span><strong id="bag-value">0/8</strong></div>
        <button id="map-button" type="button" aria-pressed="false">Harita</button>
      </section>

      <button id="upgrade-button" type="button" aria-expanded="false" aria-label="Yükseltmeler">▦</button>

      <section id="upgrade-panel" hidden aria-label="Yükseltmeler">
        <header>
          <h2>Yükseltmeler</h2>
          <button id="upgrade-close" type="button" aria-label="Kapat">✕</button>
        </header>
        <ul id="upgrade-list"></ul>
      </section>

      <div id="objective">Sokaktaki atıkları topla</div>
      <div id="status-message" role="status"></div>

      <div id="joystick-zone" aria-hidden="true">
        <div id="joystick-base">
          <div id="joystick-knob"></div>
        </div>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
