name: Import hypercasual character

on:
  push:
    branches:
      - asset/hypercasual-character-glb
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-hypercasual-character-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  import-and-build:
    if: github.head_ref == 'asset/hypercasual-character-glb' || github.ref_name == 'asset/hypercasual-character-glb'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target branch
        id: target
        run: echo "branch=${{ github.event.pull_request.head.ref || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout character branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.branch }}

      - name: Download character from Poly Pizza
        env:
          POLY_PIZZA_KEY: ${{ secrets.POLY_PIZZA_KEY }}
        run: |
          set -euo pipefail
          mkdir -p public/models

          if [ -s public/models/hyper-casual-character.glb ]; then
            echo "Character asset already exists; keeping repository copy."
            exit 0
          fi

          python3 - <<'PY'
import json
import os
import re
import urllib.error
import urllib.request
from html import unescape
from pathlib import Path

MODEL_ID = '6kFNcL9OnO'
MODEL_PAGE = f'https://poly.pizza/m/{MODEL_ID}'
API_URL = f'https://api.poly.pizza/v1/model/{MODEL_ID}'
OUTPUT = Path('public/models/hyper-casual-character.glb')


def request(url: str, headers: dict[str, str] | None = None) -> bytes:
    req = urllib.request.Request(
        url,
        headers={
            'User-Agent': 'Recycle-Factory-GitHub-Actions/1.0',
            'Accept': '*/*',
            **(headers or {}),
        },
    )
    with urllib.request.urlopen(req, timeout=30) as response:
        return response.read()


def find_download_url(value) -> str | None:
    if isinstance(value, dict):
        for key, item in value.items():
            if key.lower() == 'download' and isinstance(item, str) and item.startswith('http'):
                return item
        for item in value.values():
            found = find_download_url(item)
            if found:
                return found
    elif isinstance(value, list):
        for item in value:
            found = find_download_url(item)
            if found:
                return found
    return None


def parse_json_download(raw: bytes) -> str | None:
    try:
        return find_download_url(json.loads(raw.decode('utf-8')))
    except (UnicodeDecodeError, json.JSONDecodeError):
        return None


def parse_html_download(raw: bytes) -> str | None:
    text = unescape(raw.decode('utf-8', errors='replace')).replace('\\u0026', '&').replace('\\/', '/')

    for pattern in (
        r'"Download"\s*:\s*"([^"]+)"',
        r'"download"\s*:\s*"([^"]+)"',
        r'(https://[^"\'<> ]+\.glb(?:\?[^"\'<> ]*)?)',
    ):
        match = re.search(pattern, text, flags=re.IGNORECASE)
        if match:
            return match.group(1)

    next_data = re.search(
        r'<script[^>]+id=["\']__NEXT_DATA__["\'][^>]*>(.*?)</script>',
        text,
        flags=re.DOTALL,
    )
    if next_data:
        found = parse_json_download(next_data.group(1).encode('utf-8'))
        if found:
            return found

        try:
            payload = json.loads(next_data.group(1))
            build_id = payload.get('buildId')
            if build_id:
                data_url = f'https://poly.pizza/_next/data/{build_id}/m/{MODEL_ID}.json'
                found = parse_json_download(request(data_url))
                if found:
                    return found
        except (json.JSONDecodeError, urllib.error.URLError):
            pass

    return None


def resolve_download() -> str:
    headers = {}
    api_key = os.environ.get('POLY_PIZZA_KEY', '').strip()
    if api_key:
        headers['X-Auth-Token'] = api_key

    try:
        found = parse_json_download(request(API_URL, headers))
        if found:
            print('Resolved model through Poly Pizza API.')
            return found
    except urllib.error.HTTPError as error:
        print(f'Poly Pizza API returned HTTP {error.code}; trying page metadata.')
    except urllib.error.URLError as error:
        print(f'Poly Pizza API request failed: {error}; trying page metadata.')

    page = request(MODEL_PAGE)
    found = parse_html_download(page)
    if found:
        print('Resolved model through Poly Pizza page metadata.')
        return found

    raise SystemExit('Could not resolve the Poly Pizza GLB download URL')


download_url = resolve_download()
model_bytes = request(download_url)
OUTPUT.write_bytes(model_bytes)
print(f'Downloaded {len(model_bytes)} bytes.')
PY

      - name: Validate GLB
        run: |
          python3 - <<'PY'
from pathlib import Path
import struct

path = Path('public/models/hyper-casual-character.glb')
data = path.read_bytes()
if len(data) < 20:
    raise SystemExit('GLB file is unexpectedly small')
magic, version, declared_length = struct.unpack_from('<4sII', data, 0)
if magic != b'glTF' or version != 2 or declared_length != len(data):
    raise SystemExit('Downloaded file is not a valid GLB 2.0 asset')
print(f'Validated GLB: {len(data)} bytes')
PY

      - name: Remove temporary embedded chunks
        run: rm -rf src/assets/hyper-casual-character

      - name: Commit imported asset
        env:
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          changes="$(git status --porcelain -- public/models/hyper-casual-character.glb src/assets/hyper-casual-character)"
          if [ -z "$changes" ]; then
            echo "No asset changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/models/hyper-casual-character.glb src/assets/hyper-casual-character
            git commit -m "feat: import rigged hypercasual character asset"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
