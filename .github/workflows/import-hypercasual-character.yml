name: Import hypercasual character

on:
  push:
    branches:
      - asset/hypercasual-character-glb
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-hypercasual-character
  cancel-in-progress: true

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: asset/hypercasual-character-glb

      - name: Download character from Poly Pizza
        env:
          POLY_PIZZA_KEY: ${{ secrets.POLY_PIZZA_KEY }}
        run: |
          set -euo pipefail
          mkdir -p public/models

          if [ -s public/models/hyper-casual-character.glb ]; then
            echo "Character asset already exists; keeping repository copy."
          else
            headers=()
            if [ -n "${POLY_PIZZA_KEY:-}" ]; then
              headers=(-H "X-Auth-Token: ${POLY_PIZZA_KEY}")
            fi

            curl --fail --silent --show-error --location \
              "${headers[@]}" \
              "https://api.poly.pizza/v1/model/6kFNcL9OnO" \
              --output /tmp/model.json

            download_url="$(python3 - <<'PY'
import json
from pathlib import Path
metadata = json.loads(Path('/tmp/model.json').read_text())
url = metadata.get('Download') or metadata.get('download')
if not isinstance(url, str) or not url.startswith('http'):
    raise SystemExit('Poly Pizza response did not contain a valid Download URL')
print(url)
PY
)"

            curl --fail --silent --show-error --location \
              "$download_url" \
              --output public/models/hyper-casual-character.glb
          fi

      - name: Validate GLB
        run: |
          python3 - <<'PY'
from pathlib import Path
import struct

path = Path('public/models/hyper-casual-character.glb')
data = path.read_bytes()
if len(data) < 20:
    raise SystemExit('GLB file is unexpectedly small')
magic, version, declared_length = struct.unpack_from('<4sII', data, 0)
if magic != b'glTF' or version != 2 or declared_length != len(data):
    raise SystemExit('Downloaded file is not a valid GLB 2.0 asset')
print(f'Validated GLB: {len(data)} bytes')
PY

      - name: Remove temporary embedded chunks
        run: rm -rf src/assets/hyper-casual-character

      - name: Commit imported asset
        run: |
          if git diff --quiet -- public/models/hyper-casual-character.glb src/assets/hyper-casual-character; then
            echo "No asset changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/models/hyper-casual-character.glb src/assets/hyper-casual-character
            git commit -m "feat: import rigged hypercasual character asset"
            git push origin HEAD:asset/hypercasual-character-glb
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
