name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type-check and build
        run: npm run build

  verify-pages:
    if: github.event_name == 'pull_request' && github.head_ref == 'chore/verify-character-pages'
    runs-on: ubuntu-latest
    steps:
      - name: Verify live game and character asset
        run: |
          set -euo pipefail
          page_url="https://eraybek.github.io/recycle-factory/"
          model_url="https://eraybek.github.io/recycle-factory/models/hyper-casual-character.glb"

          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location "$page_url" --output /tmp/page.html; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Pages site did not become available."
              exit 1
            fi
            sleep 10
          done

          js_path="$(grep -oE 'assets/index-[^"'"']+\.js' /tmp/page.html | head -1)"
          test -n "$js_path"
          curl --fail --silent --show-error --location \
            "https://eraybek.github.io/recycle-factory/$js_path" \
            --output /tmp/app.js
          grep -q 'hyper-casual-character.glb' /tmp/app.js

          curl --fail --silent --show-error --location "$model_url" --output /tmp/model.glb
          python3 - <<'PY'
          from pathlib import Path
          import struct

          data = Path('/tmp/model.glb').read_bytes()
          magic, version, declared_length = struct.unpack_from('<4sII', data, 0)
          if magic != b'glTF' or version != 2 or declared_length != len(data):
              raise SystemExit('Live character asset is not a valid GLB 2.0 file')
          print(f'Live character asset validated: {len(data)} bytes')
          PY
