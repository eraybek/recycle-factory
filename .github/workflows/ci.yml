name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  inspect-character-rig:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/neutral-idle-walk'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect GLB rig and animations
        run: |
          python3 - <<'PY'
          import json
          import struct
          from pathlib import Path

          data = Path('public/models/hyper-casual-character.glb').read_bytes()
          magic, version, total = struct.unpack_from('<4sII', data, 0)
          if magic != b'glTF' or version != 2 or total != len(data):
              raise SystemExit('Invalid GLB')

          chunk_len, chunk_type = struct.unpack_from('<II', data, 12)
          if chunk_type != 0x4E4F534A:
              raise SystemExit('First GLB chunk is not JSON')

          gltf = json.loads(data[20:20 + chunk_len].decode('utf-8').rstrip('\x00 '))
          print('ANIMATIONS:')
          for animation in gltf.get('animations', []):
              print('-', animation.get('name', '<unnamed>'), 'channels=', len(animation.get('channels', [])))

          print('NODES:')
          for index, node in enumerate(gltf.get('nodes', [])):
              name = node.get('name', '')
              if name:
                  print(index, name)
          PY

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type-check and build
        run: npm run build
